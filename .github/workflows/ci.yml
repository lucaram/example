name: CI

# Pillar 4: functional, security, performance and mutation checks on every change.
# No secrets are needed here: the AI is mocked. Real model calls only happen in evals.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Contract in sync with the schemas (context drift check)
        run: npm run contracts:check
      - name: Dependency allow-list (hallucinated or malicious packages)
        run: npm run deps:check
      - name: Test lint (no fixed waits, no CSS locators, every test tagged)
        run: npm run lint:tests
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  playwright:
    name: Playwright API and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Traceability report (fails if a requirement has no test)
        if: always()
        run: npm run trace -- --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-report
          path: reports/trace-report.*
          if-no-files-found: ignore

  mutation:
    name: Mutation score (do the tests catch bugs?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore

  perf:
    name: Performance smoke (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Start the API
        run: |
          PORT=4000 LLM_MODE=mock TEST_MODE=1 LOG=off node apps/api/src/server.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break || sleep 1; done
      - run: k6 run --summary-export perf/out/summary.json perf/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-summary
          path: perf/out/summary.json
          if-no-files-found: ignore
